name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > secret.properties

      - name: Build release APK
        run: |
          ./gradlew assembleRelease
          cp build/outputs/apk/release/wifiControl-release.apk WiFiControl.apk
          echo "VERSION=$(grep -m1 'versionName' build.gradle.kts | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiControl-${{ env.VERSION }}
          path: WiFiControl.apk

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "WiFiControl $GITHUB_REF_NAME" --generate-notes --latest
          gh release upload "$GITHUB_REF_NAME" WiFiControl.apk --clobber
